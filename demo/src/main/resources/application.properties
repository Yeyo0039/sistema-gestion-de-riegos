# Nombre usado por Spring Boot en logs y metadatos.
spring.application.name=demo
# Puerto HTTP donde se sirve la interfaz y la API.
server.port=${SERVER_PORT:9090}

spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:5432/sistema de riego}
spring.datasource.username=${DB_USERNAME:postgres}
# La contraseña se define fuera del repositorio mediante DB_PASSWORD.
spring.datasource.password=${DB_PASSWORD:}
# Ajustes del pool de conexiones JDBC.
spring.datasource.hikari.pool-name=RiegosHikariPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Ejecuta schema.sql automáticamente al iniciar.
spring.sql.init.mode=always
